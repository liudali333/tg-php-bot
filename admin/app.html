<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram · Telegram 菜单管理</title><link rel="stylesheet" href="/style.css?v=20261109-3"></head><body>
<div id="login" class="login-shell hidden"><div class="login-card"><div class="brandmark">T<span>↗</span></div><h1>Telegram 菜单管理</h1><p>登录后管理 Telegram 多级菜单与自动回复</p><form id="loginForm"><label>管理员账号<input name="username" autocomplete="username" value="admin" required></label><label>管理密码<input type="password" name="password" autocomplete="current-password" required></label><button class="primary full">登录管理后台</button></form><div id="loginError" class="error"></div></div></div>
<div id="dashboard" class="hidden"><header class="topbar"><div class="logo">T<span>↗</span></div><div class="appname">Telegram 菜单助手 <small>TELEGRAM · 菜单控制中心</small></div><div class="grow"></div><span class="live"><i></i> 管理控制台</span><button id="exportBtn" class="ghost">导出配置</button><button id="logoutBtn" class="ghost">退出</button></header>
<div class="layout"><aside class="sidebar"><div class="group-head"><span>导航菜单</span><button id="addPage" title="新建菜单">＋</button></div><div id="pages" class="navlist"></div><div class="group-head second"><span>自动回复</span><button id="addReply" title="新建回复">＋</button></div><div id="replies" class="navlist"></div><div class="sidebar-note">发布后，未连接的菜单会自动加入首页。发送 /start 查看最新菜单。</div></aside>
<main class="main"><div class="main-head"><div><div class="crumb" id="crumb">机器人 / 首页</div><h1 id="itemTitle">首页菜单</h1><p id="itemDesc">编辑文字内容及按钮布局</p></div><div class="head-actions"><span id="dirty" class="dirty hidden">● 未保存</span><button id="saveBtn" class="primary">发布更新</button></div></div><div id="notice" class="notice hidden"></div><div class="workspace"><section class="editor card"><div id="editorContent"></div></section><section class="preview card"><div class="preview-top"><span>实时预览</span><span>随编辑实时更新</span></div><div class="phone"><div class="tghead"><span class="avatar">T</span><div>Telegram 菜单助手<small>bot</small></div></div><div class="chat"><div class="bubble"><div class="sender">Telegram 菜单助手</div><div id="previewText" class="msg"></div><div id="previewButtons" class="buttons"></div></div></div><div class="inputbar">☰ <span>发送消息...</span> ↗</div></div><p class="hint">预览用于检查排版，实际按钮行为以 Telegram 为准。</p></section></div></main></div></div>
<script src="/app.js?v=20261109-3"></script></body></html>
